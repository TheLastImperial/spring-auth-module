
name: Java CI with Maven

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github
        server-username-env-var: GITHUB_ACTOR
        server-password-env-var: GITHUB_TOKEN
    - name: Build with Maven
      run: mvn -B clean package deploy -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Project version
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version: $VERSION"

    - name: Get Auth ArtefactId
      id: get_auth_artefact_id
      run: |
        AUTH_ARTEFACT=$(mvn -f src/auth/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        echo "AUTH_ARTEFACT=$AUTH_ARTEFACT" >> $GITHUB_ENV
        echo "Auth Artefact ID: $AUTH_ARTEFACT"

    - name: Get Domain ArtefactId
      id: get_domain_artefact_id
      run: |
        DOMAIN_ARTEFACT=$(mvn -f src/domain/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        echo "DOMAIN_ARTEFACT=$DOMAIN_ARTEFACT" >> $GITHUB_ENV
        echo "Domain Artefact ID: $DOMAIN_ARTEFACT"

    - name: Get Admin ArtefactId
      id: get_admin_artefact_id
      run: |
        ADMIN_ARTEFACT=$(mvn -f src/admin/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        echo "ADMIN_ARTEFACT=$ADMIN_ARTEFACT" >> $GITHUB_ENV
        echo "Admin Artefact ID: $ADMIN_ARTEFACT"

    - name: Get OAuth Server ArtefactId
      id: get_oauthserver_artefact_id
      run: |
        OAUTHSERVER_ARTEFACT=$(mvn -f src/oauthserver/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        echo "OAUTHSERVER_ARTEFACT=$OAUTHSERVER_ARTEFACT" >> $GITHUB_ENV
        echo "OAuth Server Artefact ID: $OAUTHSERVER_ARTEFACT"

    - name: Get OAuth Client ArtefactId
      id: get_oauthclient_artefact_id
      run: |
        OAUTHCLIENT_ARTEFACT=$(mvn -f src/oauthclient/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        echo "OAUTHCLIENT_ARTEFACT=$OAUTHCLIENT_ARTEFACT" >> $GITHUB_ENV
        echo "OAuth Client Artefact ID: $OAUTHCLIENT_ARTEFACT"

    - name: Create notes for release from commits.
      id: release_notes
      run: |
        echo "Reading CHANGELOG.md..."
        CHANGELOG=$(cat CHANGELOG.md)

        # Save messages in multiline variable.
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "CHANGELOG<<$EOF" >> $GITHUB_ENV
        echo "$CHANGELOG" >> $GITHUB_ENV
        echo "$EOF" >> $GITHUB_ENV

    - name: create Tag and Release on GitHub
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "v${{ env.VERSION }}"
        name: "Release v${{ env.VERSION }}"
        body: |
          ${{ env.CHANGELOG }}
        draft: false
        prerelease: false
        files: |
            src/auth/target/${{ env.AUTH_ARTEFACT }}-${{ env.VERSION }}.jar
            src/domain/target/${{ env.DOMAIN_ARTEFACT }}-${{ env.VERSION }}.jar
            src/admin/target/${{ env.ADMIN_ARTEFACT }}-${{ env.VERSION }}.jar
            src/oauthserver/target/${{ env.OAUTHSERVER_ARTEFACT }}-${{ env.VERSION }}.jar
            src/oauthclient/target/${{ env.OAUTHCLIENT_ARTEFACT }}-${{ env.VERSION }}.jar

