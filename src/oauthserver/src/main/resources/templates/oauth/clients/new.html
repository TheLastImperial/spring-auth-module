<html layout:decorate="~{layouts/main}">
<body>
  <div layout:fragment="content">
    <!-- START -->

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="mb-4">
          <a th:href="@{/clients}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-1"></i> Back to OAuth2 Clients
          </a>
          <h1 class="h3 fw-bold mt-2">Create new OAuth2 Client</h1>
          <p class="text-muted mb-0">
            Complete the data to register a new OAuth2 Client.
          </p>
        </div>

        <div class="form-container">
          <form novalidate
              th:object="${newRegisteredClient}"
              th:action="@{/clients/new}"
              method="post"
              enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">
                Redirect Uris
              </label>
              <input
                type="text"
                class="form-control"
                required
                maxlength="100"
                th:field="*{redirectUris}">
            </div>
            <div class="mb-3">
              <label class="form-label">
                Post Logout Redirect Uris
              </label>
              <input
                type="text"
                class="form-control"
                required
                maxlength="100"
                th:field="*{postLogoutRedirectUris}">
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-end">
              <a th:href="@{/clients}" class="btn btn-secondary">
                  Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- END -->
  </div>
</body>
</html>
