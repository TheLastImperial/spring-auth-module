<html layout:decorate="~{layouts/main}">
<body>
  <div layout:fragment="content">
    <!-- START -->

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
<!--
      <a
        class="btn btn-primary"
        th:href="@{/admin/users/new}"
      >
        <i class="bi bi-plus-lg me-1"></i> New User
      </a>
-->
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Username</th>
              <th class="text-center">Enabled</th>
              <th class="text-center">Account not expired</th>
              <th class="text-center">Credentials non expired</th>
              <th class="text-center">Account non locked</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr th:each="user : ${page.getContent}">
              <td th:text="${user.username}"></td>
              <td class="text-center">
                <span
                  class="badge status-badge"
                  th:text="${user.enabled} ? 'Active' : 'Inactive' "
                  th:classappend="${user.enabled} ? 'text-bg-success' : 'text-bg-secondary'">
                </span>
              </td>
              <td class="text-center">
                <span
                  class="badge status-badge"
                  th:text="${user.accountNonExpired} ? 'Active' : 'Inactive' "
                  th:classappend="${user.accountNonExpired} ? 'text-bg-success' : 'text-bg-secondary'">
                </span>
              </td>
              <td class="text-center">
                <span
                  class="badge status-badge"
                  th:text="${user.credentialsNonExpired} ? 'Active' : 'Inactive' "
                  th:classappend="${user.credentialsNonExpired} ? 'text-bg-success' : 'text-bg-secondary'">
                </span>
              </td>
              <td class="text-center">
                <span
                  class="badge status-badge"
                  th:text="${user.accountNonLocked} ? 'Active' : 'Inactive' "
                  th:classappend="${user.accountNonLocked} ? 'text-bg-success' : 'text-bg-secondary'">
                </span>
              </td>
              <td class="text-end">
                <a
                  th:href="@{/admin/users/show/{username}(username=${user.username})}"
                  class="btn btn-sm btn-outline-info action-btn me-1">
                  <i class="bi bi-eye"></i>
                </a>
                <a class="btn btn-sm action-btn"
                  th:href="@{/admin/users/lock-unlock/{username}(username=${user.username})}"
                  th:classappend="${user.accountNonLocked} ? 'btn-outline-danger' : 'btn-outline-success'">
                  <i class="bi"
                    th:classappend="${user.accountNonLocked} ? 'bi-lock' : 'bi-unlock'"
                  ></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div th:replace="
        utils/fragments/pagination.html ::
        pagination(page=${page}, baseUrl='/admin/users', defaultSize=2)"
      >
      </div>

    </div>

    <!-- END -->
  </div>
</body>
</html>
